async function unlockAudio() {
  // Must be called synchronously inside a user-gesture handler to satisfy iOS
  const ctx = getCtx();
  if (ctx.state === 'suspended') await ctx.resume();
  // Start (or resume) silent HTMLAudio loop so WebAudio routes through the iOS
  // media channel rather than the ringer (bypasses the hardware silent switch).
  try { await ensureSilentAudio().play(); } catch (e) {}
  setupMediaSession(true);
  // Silent blip — satisfies iOS Safari's WebAudio gesture requirement
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  gain.gain.value = 0;
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.001);
  // Warm the audio output stack so the first real playback starts at full
  // amplitude on its very first sample (kills the cold-start fade on macOS).
  primeAudio(0.2);
  // Warm _wordAudio (the HTMLAudioElement for .m4a word reveals) with a short
  // silent WAV. Browsers require at least one play() within a user-gesture context
  // before allowing programmatic play() from async code. In listen mode playWordAudio
  // is called deep inside an async loop — outside any gesture — so without this
  // warm-up the browser silently blocks it. Practice mode avoids the bug because
  // playWordAudio happens from a click handler (a fresh gesture), but that shouldn't
  // be the only path that unlocks the element.
  {
    const wa = _ensureWordAudio();
    const sr = 8000, n = Math.floor(sr * 0.05);
    const buf = new ArrayBuffer(44 + n * 2);
    const dv = new DataView(buf);
    const wr4 = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    wr4(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wr4(8, 'WAVE');
    wr4(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    wr4(36, 'data'); dv.setUint32(40, n * 2, true);
    const warmUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    wa.volume = 0;
    wa.src = warmUrl;
    try { const p = wa.play(); if (p) await p.then(() => wa.pause(), () => {}); } catch(_) {}
    setTimeout(() => { try { URL.revokeObjectURL(warmUrl); } catch(_) {} }, 1000);
  }
  // Warm _morseAudio (the single reused HTMLAudioElement for all iOS blobs)
  // with a 1.5 s silent blob. unlockAudio() already warms the AudioContext and
  // _silentAudio, but _morseAudio stays cold until its first real play(). iOS
  // performs a ~100-300 ms audio-session ramp on the first play() of any
  // HTMLAudioElement; doing it here with silence means the first real beep and
  // Morse word start into a fully ramped session at full amplitude (word-1 duck).
  if (_isIOS) {
    const _warmSr = 22050;
    await _playPcmBlob(new Float32Array(Math.floor(_warmSr * 1.5)), _warmSr, 1.5);
  }
}

function playTestR() {
  const fwpm = state.cfg.farnsworth ? Math.min(state.cfg.fwpm, state.cfg.wpm) : state.cfg.wpm;
  playMorseAudio('R', state.cfg.wpm, fwpm, state.tweaks.frequency);

function goSettings() {
  clearTimeout(state.autoPlayTimer);
  clearTimeout(state._advanceTimer);
  const ki = document.getElementById('_kb-session-input');
  if (ki) ki.remove();
  const ls = state.listenState;
  if (ls.active) {
    ls.stopRequested = true;
    ls.active = false;
    clearInterval(ls.timerInterval);
    if (ls._sleepResolve) { ls._sleepResolve(); ls._sleepResolve = null; }
    stopKeepAlive();
    releaseWakeLock();
    setupMediaSession(false);
    try { _silentAudio && _silentAudio.pause(); } catch (e) {}
  }
  state.screen = 'settings';
  state.playState = 'idle';
  render();
}

async function startPractice() {
  if (state._startingPractice || state.screen === 'practice') return;  // guard: ignore double-taps
  state._startingPractice = true;
  // Build the question synchronously so we can switch screens immediately.
  clearTimeout(state.autoPlayTimer);
  if (state.cfg.listKey === 'missed') {
    const missedList = getMissedWordsList();
    if (missedList.length === 0) {
      state._startingPractice = false;
      state.screen = 'missedEmpty';
      render();
      return;
    }
    state._missedSessionPool = missedList;
  } else {
    state._missedSessionPool = null;
  }
  state.q = makeQuestion(state.cfg.listKey);
  state.chosen = null;
  state.kbTyped = '';
  state.screen = 'practice';
  state.playState = 'playing';
  state.score = { c:0, t:0 };
  state.sessionLog = [];
  state._summaryAnnounced = false;

  // KB input mode: create and focus a persistent hidden input BEFORE any await so
  // iOS sees the focus() as originating from the user's button tap (gesture context).
  // This keeps the keyboard visible for the entire session without requiring a tap.
  if (state.cfg.keyboardInput) {
    const old = document.getElementById('_kb-session-input');
    if (old) old.remove();
    const ki = document.createElement('input');
    ki.id = '_kb-session-input';
    ki.type = 'text';
    ki.setAttribute('autocomplete', 'off');
    ki.setAttribute('autocorrect', 'off');
    ki.setAttribute('autocapitalize', 'none');
    ki.setAttribute('spellcheck', 'false');
    Object.assign(ki.style, {
      position:'fixed', top:'-200px', left:'0',
      width:'1px', height:'1px', opacity:'0.01',
      border:'none', outline:'none', background:'transparent',
      fontSize:'16px',  // ≥16px prevents iOS auto-zoom
    });
    ki.addEventListener('input', e => {
      const filtered = e.target.value.replace(/[^a-zA-Z0-9\-\/]/g, '');
      state.kbTyped = filtered.toLowerCase();
      ki.value = state.kbTyped.toUpperCase();
      updateKbDisplay();
    });
    document.body.appendChild(ki);
    ki.focus(); // still in gesture context → iOS shows keyboard
  }

  render();                     // immediate screen switch on first tap
  await unlockAudio();          // iOS audio unlock — must stay within gesture handler
  state._startingPractice = false;
  doPlay();
}

async function startListen() {
  const ls = state.listenState;
  if (ls.active || ls._starting) return;   // guard: ignore double-taps during audio unlock
  ls._starting = true;
  state._listenSummaryAnnounced = false;
  // Switch screen immediately so the user sees the transition on the first tap.
  state.screen = 'listen';
  render();
  await unlockAudio();
  ls._starting = false;
  primeAudio(0.2);              // belt-and-suspenders: warm the output stack before the first beep/word
  startKeepAlive();
  requestWakeLock();
  ls.active = true;
  ls.elapsed = 0;
  ls.wordCount = 0;
  ls.currentWord = '';
  ls.stopRequested = false;
  ls._sleepResolve = null;
  clearInterval(ls.timerInterval);
  ls.timerInterval = setInterval(() => {
    ls.elapsed++;
    const te = document.getElementById('listen-timer');
    if (te) te.textContent = fmtHMS(ls.elapsed);
    if (ls.elapsed >= state.cfg.listenDuration) stopListen();
  }, 1000);
  render();
  if (state.cfg.screenReaderMode) {
    announceTTS(`Listen mode. Duration ${fmtDur(state.cfg.listenDuration)}.`);
  } else {
    announce('Listen mode started.');
  }

  const { cfg, tweaks } = state;
  const pool = getWordPool(cfg.listKey);
  const fwpm = cfg.farnsworth ? Math.min(cfg.fwpm, cfg.wpm) : cfg.wpm;
  // iOS suspends WebAudio on lock-screen / backgrounding — route Morse through
  // HTMLAudio blobs there so listen mode keeps playing. Other platforms stay on
  // the lower-latency WebAudio path.
  const playMorseFn = _isIOS ? playMorseAudioBlob : playMorseAudio;
  const playBeepFn = _isIOS ? playListenBeepBlob : playListenBeep;
  let lastWord = '';

  while (!ls.stopRequested) {
    let word;
    do { word = pool[Math.floor(Math.random() * pool.length)]; }
    while (word === lastWord && pool.length > 1);
    lastWord = word;
    ls.currentWord = word;
    ls.wordCount++;
    state.currentTone = pickWordTone();

    const we = document.getElementById('listen-word');
    if (we) we.textContent = word;
    const ce = document.getElementById('listen-count');
    if (ce) ce.textContent = `${ls.wordCount} word${ls.wordCount !== 1 ? 's' : ''} played`;

    // Announcement beep then gap before the word
    await playBeepFn(cfg.wpm, tweaks.frequency);
    if (ls.stopRequested) break;
    await listenSleep(500, ls);
    if (ls.stopRequested) break;
    const stdGap = 7 * 1200 / fwpm;

    if (cfg.listenVoice) {
      // Voice ON: first morse, before-voice repeats, gap, voice reveal, after-voice repeats
      await listenSleep(stdGap, ls);
      if (ls.stopRequested) break;
      await playMorseFn(word, cfg.wpm, fwpm, state.currentTone);
      if (ls.stopRequested) break;
      for (let r = 0; r < cfg.listenRepeatBefore; r++) {
        await listenSleep(cfg.listenDelay * stdGap, ls);
        if (ls.stopRequested) break;
        await playMorseFn(word, cfg.wpm, fwpm, state.currentTone);
        if (ls.stopRequested) break;
      }
      if (ls.stopRequested) break;
      await listenSleep(cfg.listenDelay * stdGap, ls);
      if (ls.stopRequested) break;
      if ((cfg.listenFirstGap ?? 0) > 0) { await listenSleep(cfg.listenFirstGap * 1000, ls); if (ls.stopRequested) break; }
      await playWordAudio(word);
      if (ls.stopRequested) break;
      { try { const ctx = getCtx(); if (ctx.state === 'suspended') ctx.resume().catch(() => {}); } catch(e) {} }
      for (let r = 0; r < cfg.listenRepeatAfter; r++) {
        await listenSleep(cfg.listenDelay * stdGap, ls);
        if (ls.stopRequested) break;
        await playMorseFn(word, cfg.wpm, fwpm, state.currentTone);
        if (ls.stopRequested) break;
      }
    } else {
      // Voice OFF: first morse, then (before + after) repeats with configurable gap
      const totalRepeat = cfg.listenRepeatBefore + cfg.listenRepeatAfter;
      await listenSleep(stdGap, ls);
      if (ls.stopRequested) break;
      await playMorseFn(word, cfg.wpm, fwpm, state.currentTone);
      if (ls.stopRequested) break;
      for (let r = 0; r < totalRepeat; r++) {
        await listenSleep(cfg.listenDelay * stdGap, ls);
        if (ls.stopRequested) break;
        await playMorseFn(word, cfg.wpm, fwpm, state.currentTone);
        if (ls.stopRequested) break;
      }
    }
    if (ls.stopRequested) break;
  }

  if (ls.active) stopListen();
}

function stopListen() {
  const ls = state.listenState;
  if (!ls.active) return;
  ls.stopRequested = true;
  ls.active = false;
  clearInterval(ls.timerInterval);
  if (ls._sleepResolve) { ls._sleepResolve(); ls._sleepResolve = null; }
  stopKeepAlive();
  releaseWakeLock();
  setupMediaSession(false);
  try { _silentAudio && _silentAudio.pause(); } catch (e) {}
  state.screen = 'listenSummary';
  render();
}

async function doPlay() {
  if (state.playing) return;
  state.playing = true;
  state.currentTone = pickWordTone();
  if (state.playState !== 'playing') {
    state.playState = 'playing';
    render();
  }
  const fwpm = state.cfg.farnsworth ? Math.min(state.cfg.fwpm, state.cfg.wpm) : state.cfg.wpm;
  try {
    await playMorseAudio(state.q.correct, state.cfg.wpm, fwpm, state.currentTone);
  } finally {
    state.playing = false;
  }
  if (state.playState === 'playing') { state.playState = 'ready'; transitionToReady(); speakChoicesIfSR(); }
}

// In Screen Reader Mode, read the four choices aloud after Morse plays so the
// user can pick by number key (1–4) without seeing the screen.
function speakChoicesIfSR() {
  if (!state.cfg.screenReaderMode || !state.q || state.cfg.keyboardInput) return;
  if (!window.speechSynthesis) return;
  // Speak "Choose" then each choice with a 300 ms gap between utterances
  const items = ['Choose:', ...state.q.choices.map((c, i) => `${i + 1}. ${c}`)];
  let delay = 300;
  items.forEach(text => {
    setTimeout(() => {
      // Bail if the user already answered or moved to next question
      if (state.playState !== 'ready') return;
      try {
        const utt = new SpeechSynthesisUtterance(text);
        utt.volume = (state.cfg.voiceVolume ?? 75) / 100;
        window.speechSynthesis.speak(utt);
      } catch (e) {}
    }, delay);
    delay += 300;
  });
}

function refreshHeader() {

function transitionToAnswered(choice) {
  const t = T(), q = state.q, ok = choice === q.correct;
  refreshHeader();
  const pa = document.getElementById('cw-play-area');
  if (pa) {
    pa.style.height = ok ? '72px' : '88px'; pa.innerHTML = '';
    // pa stays as wave area — wrong-actions go below
  }
  // Remove stale wrong-actions from a previous wrong answer
  const existingWA = document.getElementById('cw-wrong-actions');
  if (existingWA) existingWA.remove();
  const s = document.getElementById('cw-status');
  if (s) {
    if (ok) { s.textContent = '✓ Correct!'; s.style.color = t.correct; s.style.fontWeight = '700'; s.style.fontSize = '18px'; }
    else {
      if (state.cfg.keyboardInput) { s.textContent = '✗ Incorrect!'; s.style.color = t.wrong; s.style.fontWeight = '700'; s.style.fontSize = '18px'; }
      else { s.textContent = ''; }
    }
  }
  // Screen-reader-only announcement (visible reveal section also shows the word)
  if (ok) announce(`Correct. Score ${state.score.c} of ${state.score.t}.`);
  else    announce(`Incorrect. The answer is ${q.correct}. Score ${state.score.c} of ${state.score.t}.`);
  if (!ok && s) s.insertAdjacentElement('afterend', makeWrongActions(t));

  if (state.cfg.keyboardInput) {
    // Update the keyboard input display in-place
    const kbDiv = document.getElementById('cw-kb-display');
    if (kbDiv) {
      kbDiv.innerHTML = '';
      if (ok) {
        const okBox = el('div', { style:{
          background:t.correctDim, border:`2px solid ${t.correct}`, borderRadius: t.scanlines ? '2px' : '12px',
          padding:'16px 20px', textAlign:'center',
        }});
        okBox.appendChild(el('div', { style:{ fontFamily:t.mono, fontSize:'24px', fontWeight:'700', letterSpacing:'4px', color:t.correct }}, choice.toUpperCase()));
        okBox.appendChild(el('div', { style:{ fontSize:'13px', color:t.correct, marginTop:'4px', fontWeight:'600' }}, '✓ Correct!'));
        kbDiv.appendChild(okBox);
      } else {
        const wrongBox = el('div', { style:{
          background:t.bgCard, border:`1px solid ${t.border}`, borderRadius: t.scanlines ? '2px' : '12px',
          padding:'16px 20px', display:'flex', flexDirection:'column', gap:'10px',
        }});
        const yourRow = el('div', { style:{ display:'flex', alignItems:'center', gap:'10px' }});
        yourRow.appendChild(el('span', { style:{ fontSize:'11px', fontWeight:'700', color:t.wrong, letterSpacing:'1px', textTransform:'uppercase', minWidth:'70px' }}, 'You typed:'));
        yourRow.appendChild(el('span', { style:{ fontFamily:t.mono, fontSize:'20px', fontWeight:'700', letterSpacing:'3px', color:t.wrong }}, (choice || '(empty)').toUpperCase()));
        yourRow.appendChild(el('span', { style:{ fontSize:'16px', color:t.wrong }}, '✗'));
        wrongBox.appendChild(yourRow);
        const corrRow = el('div', { style:{ display:'flex', alignItems:'center', gap:'10px', paddingTop:'10px', borderTop:`1px solid ${t.border}` }});
        corrRow.appendChild(el('span', { style:{ fontSize:'11px', fontWeight:'700', color:t.correct, letterSpacing:'1px', textTransform:'uppercase', minWidth:'70px' }}, 'Correct:'));
        corrRow.appendChild(el('span', { style:{ fontFamily:t.mono, fontSize:'20px', fontWeight:'700', letterSpacing:'3px', color:t.correct }}, q.correct.toUpperCase()));
        corrRow.appendChild(el('span', { style:{ fontSize:'16px', color:t.correct }}, '✓'));
        wrongBox.appendChild(corrRow);
        kbDiv.appendChild(wrongBox);
      }
    }
  } else {
    const g = document.getElementById('cw-choices');
    if (g) Array.from(g.querySelectorAll('button')).forEach(btn => {
      const w = btn.dataset.word;
      let mark = '';
      if (w === q.correct)   { btn.style.background = t.correctDim; btn.style.borderColor = t.correct; btn.style.color = t.correct; if (t.scanlines) btn.style.boxShadow = `0 0 8px ${t.correct}88`; mark = '✓'; }
      else if (w === choice) { btn.style.background = t.wrongDim;   btn.style.borderColor = t.wrong;   btn.style.color = t.wrong; mark = '✗'; }
      else                   { btn.style.color = t.textMuted; }
      if (mark) {
        btn.style.position = 'relative';
        btn.appendChild(el('span', { 'aria-hidden':'true', style:{
          position:'absolute', top:'3px', right:'6px',
          fontSize:'13px', fontWeight:'800', letterSpacing:'0',
          color: mark === '✓' ? t.correct : t.wrong,
        }}, mark));
      }
      btn.onclick = () => doPlayWord(w);
    });
  }
}

function _hideWave() {
  const pa = document.getElementById('cw-play-area');
  if (!pa) return;
  const t = T();
  pa.innerHTML = '';
  if (state.playState === 'ready') {
    const btn = el('button', { 'aria-label':'Replay Morse code', style:{
      width:'72px', height:'72px', borderRadius:'50%', background:'none',
      border:`2px solid ${t.border}`, display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:'28px', color:t.textMuted, transition:'all 0.15s', cursor:'pointer',
    }}, '↺');
    btn.addEventListener('click', e => { e.stopPropagation(); doReplay(); });
    pa.appendChild(btn);
  }
  // For wrong-answered: pa returns to empty spacer; cw-wrong-actions div persists below
}

async function doPlayWord(word) {
  if (state.playing) return;
  state.playing = true;
  state.replaying = true;
  _showWave();
  // Disable Next surgically — it may already be in the DOM as enabled
  const t0 = T();
  const nb0 = document.getElementById('next-btn');
  if (nb0) { nb0.disabled = true; nb0.style.background = t0.border; nb0.style.color = t0.textMuted; nb0.style.cursor = 'not-allowed'; }
  const fwpm = state.cfg.farnsworth ? Math.min(state.cfg.fwpm, state.cfg.wpm) : state.cfg.wpm;
  try {
    await playMorseAudio(word, state.cfg.wpm, fwpm, state.currentTone);
  } finally {
    state.playing = false;
    state.replaying = false;
  }
  if (state.playState === 'answered' || state.playState === 'ready') {
    // Still on the same question — restore wave area and re-enable Next
    _hideWave();
    const nb = document.getElementById('next-btn');
    if (nb) { nb.disabled = false; nb.style.background = T().accent; nb.style.color = T().accentText; nb.style.cursor = 'pointer'; }
    // Re-read choices after replay so blind users hear the options again
    if (state.playState === 'ready') speakChoicesIfSR();
  } else if (state.playState === 'idle') {
    // handleNext() fired while audio was playing; auto-play was skipped — retry it now
    doPlay();
  }
}

function transitionToReady() {
  const t = T();
  const pa = document.getElementById('cw-play-area');
  if (pa) {
    pa.style.height = '88px';
    pa.innerHTML = '';
    const replayCircle = el('button', { 'aria-label':'Replay Morse code', style:{
      width:'72px', height:'72px', borderRadius:'50%', background:'none',
      border:`2px solid ${t.border}`, display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:'28px', color:t.textMuted, transition:'all 0.15s', cursor:'pointer',
    }}, '↺');
    replayCircle.addEventListener('click', e => { e.stopPropagation(); doReplay(); });
    pa.appendChild(replayCircle);
  }
  const statusEl = document.getElementById('cw-status');
  if (statusEl) {
    statusEl.textContent = state.cfg.keyboardInput ? 'Type the word you heard…' : 'Select the word you heard';
    statusEl.style.color = t.textMuted; statusEl.style.fontWeight = ''; statusEl.style.fontSize = '13px';
  }
  if (state.cfg.keyboardInput) {
    const kbDiv = document.getElementById('cw-kb-display');
    if (kbDiv) {
      kbDiv.innerHTML = '';
      kbDiv.appendChild(_buildKbInputBox(t, true));
    }
  } else {
    const gridEl = document.getElementById('cw-choices');
    if (gridEl) {
      gridEl.style.opacity = '1';
      gridEl.style.pointerEvents = 'auto';
      Array.from(gridEl.querySelectorAll('button')).forEach(btn => {
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        btn.classList.add('btn-choice-hover');
        const word = btn.dataset.word;
        btn.addEventListener('click', () => handleAnswer(word));
      });
    }
  }
  const cardEl = document.getElementById('cw-card');
  if (cardEl) { cardEl.style.cursor = 'pointer'; cardEl.onclick = doReplay; }
  // Re-focus the persistent KB input so physical-keyboard users don't lose focus
  // (also helps Android; on iOS this is async so doReplay() handles it instead)
  if (state.cfg.keyboardInput) { const ki = document.getElementById('_kb-session-input'); if (ki) ki.focus(); }
}

function transitionToPlaying() {
  const t = T();
  const pa = document.getElementById('cw-play-area');
  if (pa) { pa.style.height = '88px'; pa.innerHTML = ''; pa.appendChild(renderWave(t)); }
  const statusEl = document.getElementById('cw-status');
  if (statusEl) { statusEl.textContent = 'Listening…'; statusEl.style.color = t.accent; statusEl.style.fontWeight = '500'; statusEl.style.fontSize = '13px'; }
  const revealEl = document.getElementById('cw-reveal');
  if (revealEl) revealEl.remove();
  const wrongActEl = document.getElementById('cw-wrong-actions');
  if (wrongActEl) wrongActEl.remove();
  if (state.cfg.keyboardInput) {
    const kbDiv = document.getElementById('cw-kb-display');
    if (kbDiv) { kbDiv.innerHTML = ''; kbDiv.appendChild(_buildKbInputBox(t, false)); }
  } else {
    const gridEl = document.getElementById('cw-choices');
    if (gridEl) {
      gridEl.style.opacity = '0';
      gridEl.style.pointerEvents = 'none';
      gridEl.innerHTML = '';
      state.q.choices.forEach((ch, idx) => {
        const btn = el('button', {
          'data-word': ch,
          'aria-label': `Choice ${idx + 1}: ${ch}`,
          style:{
            position:'relative',
            padding:'12px 8px', border:`2px solid ${t.border}`,
            borderRadius: t.scanlines ? '2px' : '10px',
            background:t.bgCard, color:t.text, fontSize:'15px', fontWeight:'700',
            fontFamily:t.mono, letterSpacing:'2px', textAlign:'center', transition:'all 0.15s',
            opacity:'0.4', cursor:'default',
          }}, ch.toUpperCase());
        btn.appendChild(el('span', { 'aria-hidden':'true', style:{
          position:'absolute', bottom:'3px', right:'6px',
          fontSize:'10px', fontWeight:'600', letterSpacing:'0', lineHeight:'1',
          color: t.border, opacity:'0.4',
        }}, String(idx + 1)));
        gridEl.appendChild(btn);
      });
    }
  }
  const cardEl = document.getElementById('cw-card');
  if (cardEl) cardEl.style.cursor = 'default';
}

function doReplay() {
  // Re-focus the persistent KB input within this gesture context so iOS
  // shows the keyboard again after the replay button tap stole focus.
  const ki = document.getElementById('_kb-session-input');
  if (ki) ki.focus();
  return doPlayWord(state.q.correct);
}

function _buildKbInputBox(t, active) {
  const wrap = el('div', {});
  const box = el('div', { style:{
    background:t.bgCard, border:`2px solid ${active ? t.accent : t.border}`,
    borderRadius: t.scanlines ? '2px' : '12px', padding:'10px 16px',
    display:'flex', alignItems:'center', justifyContent:'center',
    minHeight:'64px', transition:'border-color 0.2s',
    opacity: active ? '1' : '0.4',
  }});
  if (active) {
    // Display only — the actual keyboard input is routed through the persistent
    // hidden #_kb-session-input (focused in startPractice within gesture context).
    const row = el('div', { style:{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%' }});
    row.appendChild(el('span', { id:'kb-typed-text', style:{
      fontFamily:t.mono, fontSize:'24px', fontWeight:'700', letterSpacing:'4px', color:t.text,
    }}, state.kbTyped.toUpperCase() || ''));
    row.appendChild(el('span', { 'aria-hidden':'true', style:{
      fontFamily:t.mono, fontSize:'24px', fontWeight:'300', color:t.accent,
      animation:'blink 1s step-end infinite', marginLeft:'2px',
    }}, '|'));
    box.appendChild(row);
  } else {
    box.appendChild(el('span', { style:{ fontFamily:t.mono, fontSize:'24px', fontWeight:'300', color:t.textMuted }}, '|'));
  }
  wrap.appendChild(box);
  if (active) {
    wrap.appendChild(el('div', { style:{
      textAlign:'center', fontSize:'11px', color:t.textMuted, marginTop:'8px', fontFamily:t.mono, letterSpacing:'1px',
    }}, 'Enter to submit · Backspace to delete · Space to replay'));
  }
  return wrap;
}

function updateKbDisplay() {
  const span = document.getElementById('kb-typed-text');
  if (span) span.textContent = state.kbTyped.toUpperCase();
}

function handleAnswer(choice) {
  if (state.playState !== 'ready') return;
  state.chosen = choice;
  state.playState = 'answered';
  const ok = choice === state.q.correct;
  state.score = { c: state.score.c + (ok ? 1 : 0), t: state.score.t + 1 };
  state.sessionLog = [...state.sessionLog, { word: state.q.correct, correct: ok }];
  transitionToAnswered(choice);

  const sessionDone = state.sessionLog.length >= state.cfg.sessionSize;
  const sr = state.cfg.screenReaderMode;
  const kb = state.cfg.keyboardInput;
  const voice = state.cfg.listenVoice;

  function advance() {
    if (state.playState !== 'answered') return; // double-advance guard
    if (sessionDone) {
      const ki = document.getElementById('_kb-session-input');
      if (ki) ki.remove();
      updateMissedWords(state.sessionLog); state.screen = 'summary'; render();
    } else { handleNext(); }
  }

  if (ok) {
    if (kb && voice) {
      // KB mode: say "Correct" then the word, then advance
      playWordAudio('Correct').then(() => playWordAudio(choice)).then(() => setTimeout(advance, 300));
    } else {
      if (voice) playWordAudio(choice);
      if (sr) setTimeout(() => announceTTS(`Correct. ${state.score.c} of ${state.score.t}.`), 700);
      state._advanceTimer = setTimeout(advance, sr ? 2400 : 1100);
    }
  } else {
    if (kb && voice) {
      // KB mode: say "Incorrect", typed word, correct word, then replay morse
      playWordAudio('Incorrect')
        .then(() => new Promise(r => setTimeout(r, 200)))
        .then(() => choice ? playWordAudio(choice) : Promise.resolve())
        .then(() => new Promise(r => setTimeout(r, 300)))
        .then(() => playWordAudio(state.q.correct))
        .then(() => doReplay());
    } else if (voice) {
      let chain = playWordAudio(choice)
        .then(() => new Promise(r => setTimeout(r, 500)))
        .then(() => playWordAudio(state.q.correct));
      if (sr) chain = chain.then(() => new Promise(r => setTimeout(r, 200)))
                           .then(() => playWordAudio(`Score ${state.score.c} of ${state.score.t}.`));
      chain.then(() => doReplay());
    } else {
      setTimeout(() => doReplay(), 400);
    }
  }
}

function handleNext() {
  clearTimeout(state.autoPlayTimer);
  state.q = makeQuestion(state.cfg.listKey);
  state.chosen = null;
  state.kbTyped = '';
  const _ki = document.getElementById('_kb-session-input');
  if (_ki) { _ki.value = ''; _ki.focus(); }
  if (state.playing) {
    // Replay is in progress — set idle so doPlayWord picks it up after audio
    state.playState = 'idle';
    render();
    return;
  }
  state.playState = 'playing';
  transitionToPlaying();  // Targeted DOM swap — no full page flash
  doPlay();
}

// ── KEYBOARD SHORTCUTS (S5) ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Esc closes settings modal regardless of screen
  if (e.key === 'Escape' && state.settingsOpen) { state.settingsOpen = false; render(); return; }

  // Summary screen shortcuts
  if (state.screen === 'summary') {
    if (e.key === 'Enter') { e.preventDefault(); startPractice(); return; }
    if (e.key === 'Escape') { e.preventDefault(); goSettings(); return; }
    return;
  }

  if (state.screen !== 'practice') return;

  const key = e.key;
  const kbMode = state.cfg.keyboardInput;

  if (state.playState === 'answered') {
    if (key === 'Enter' && !state.playing) {
      e.preventDefault();
      clearTimeout(state._advanceTimer);
      const done = state.sessionLog.length >= state.cfg.sessionSize;
      if (done) {
        const ki = document.getElementById('_kb-session-input');
        if (ki) ki.remove();
        updateMissedWords(state.sessionLog); state.screen = 'summary'; render();
      } else { handleNext(); }
      return;
    }
    if (key === ' ' || key.toLowerCase() === 'r') { e.preventDefault(); doReplay(); return; }
  }
  if (state.playState === 'idle' || state.playState === 'ready') {
    // In keyboard-input mode 'r' is a letter to type; Space is still replay
    if (key === ' ' || (key.toLowerCase() === 'r' && !(kbMode && state.playState === 'ready'))) { e.preventDefault(); doPlay(); return; }
  }
  if (state.playState === 'ready') {
    if (kbMode) {
      // All key handling lives here. We call preventDefault() so the character is
      // NOT inserted into the <input> by the browser — we do it manually and then
      // call updateKbDisplay() to sync the input's value. This also works when the
      // input IS focused: preventDefault() at the document level still cancels the
      // default action, so there's no double-insertion.
      if (key === 'Enter') {
        e.preventDefault();
        const typed = state.kbTyped.trim();
        handleAnswer(typed.length > 0 ? typed : '');
        return;
      }
      if (key === 'Backspace') {
        e.preventDefault();
        state.kbTyped = state.kbTyped.slice(0, -1);
        updateKbDisplay();
        return;
      }
      if (key.length === 1 && /[a-zA-Z0-9\-\/]/.test(key)) {
        e.preventDefault();
        state.kbTyped += key.toLowerCase();
        updateKbDisplay();
        return;
      }
    } else {
      // Button mode: number keys select answer
      const n = parseInt(key);
      if (n >= 1 && n <= state.q.choices.length) { e.preventDefault(); handleAnswer(state.q.choices[n - 1]); }
    }
  }
});

// ── SERVICE WORKER (S10) ─────────────────────────────────────────────────────
let _pendingSW = null;     // Installed-but-waiting SW that the banner points at
let _swRefreshing = false; // Guards the controllerchange reload after user accepts

function showUpdateBanner() {
  if (document.getElementById('_update-banner')) return;
  const t = T();
  const banner = el('div', { id:'_update-banner', role:'status', 'aria-live':'polite', style:{
    position:'fixed',
    bottom:'calc(16px + env(safe-area-inset-bottom))',
    left:'50%', transform:'translateX(-50%)',
    background:t.bgCard, color:t.text,
    border:`1px solid ${t.accent}`, borderRadius:'10px',
    padding:'10px 14px', fontSize:'13px', fontWeight:'600',
    display:'flex', alignItems:'center', gap:'10px', zIndex:200,
    boxShadow:'0 6px 24px rgba(0,0,0,0.35)', maxWidth:'92vw',
  }});
  banner.appendChild(el('span', {}, 'Update available'));
  const reloadBtn = el('button', { style:{
    background:t.accent, color:t.accentText, border:'none',
    padding:'6px 12px', borderRadius:'6px',
    fontSize:'12px', fontWeight:'700', letterSpacing:'1px',
  }}, 'RELOAD');
  reloadBtn.addEventListener('click', () => {
    if (_pendingSW) _pendingSW.postMessage({ type: 'SKIP_WAITING' });
    else window.location.reload();
  });
  const dismissBtn = el('button', { 'aria-label':'Dismiss update', style:{
    background:'transparent', color:t.textMuted, border:'none',
    fontSize:'16px', padding:'0 4px',
  }}, '✕');
  dismissBtn.addEventListener('click', () => banner.remove());
  banner.appendChild(reloadBtn);
  banner.appendChild(dismissBtn);
  document.body.appendChild(banner);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    // Force iOS to re-fetch sw.js on every load — without this, iOS PWAs can
    // sit on a stale service worker indefinitely and never show the update banner.
    // Skip when offline: the fetch would fail anyway and could delay SW readiness.
    if (navigator.onLine) reg.update().catch(() => {});
    const track = nw => {
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        // "installed" + existing controller = a genuine update, not first install
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          _pendingSW = nw;
          showUpdateBanner();
        }
      });
    };
    if (reg.waiting && navigator.serviceWorker.controller) {
      _pendingSW = reg.waiting;
      showUpdateBanner();
    }
    reg.addEventListener('updatefound', () => track(reg.installing));

  }).catch(() => {});

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // Only reload when we tracked an update — avoids reloading on first install
    if (!_pendingSW || _swRefreshing) return;
    _swRefreshing = true;
    window.location.reload();
  });

}

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
